# slidechi.uz: the website (web/dist) at /, the bot's Mini App, editor and admin panel (miniapp/dist) at /app/, and the
# backend's API, in front of uvicorn. The bot points here: WEBAPP_URL=https://slidechi.uz/app, PUBLIC_URL=https://slidechi.uz.
#   cp ops/nginx/slidechi.conf /etc/nginx/sites-available/slidechi
#   cp ops/nginx/slidechi-proxy.conf ops/nginx/slidechi-headers.conf ops/nginx/slidechi-app-headers.conf /etc/nginx/snippets/
#   ln -sf /etc/nginx/sites-available/slidechi /etc/nginx/sites-enabled/slidechi && nginx -t && systemctl reload nginx
# Certificate: certbot certonly --webroot -w /var/www/certbot -d slidechi.uz -d www.slidechi.uz (renewed by certbot.timer,
# /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh reloads nginx). Only the API paths listed below are open.

limit_req_zone $binary_remote_addr zone=slidechi_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=slidechi_auth:10m rate=10r/m;
limit_req_status 429;

upstream slidechi_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name slidechi.uz www.slidechi.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://slidechi.uz$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.slidechi.uz;
    ssl_certificate     /etc/letsencrypt/live/slidechi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slidechi.uz/privkey.pem;
    return 301 https://slidechi.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name slidechi.uz;

    ssl_certificate     /etc/letsencrypt/live/slidechi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slidechi.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:slidechi_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/slideai-src/slideai/web/dist;
    server_tokens off;
    client_max_body_size 100m;          # images -> PDF: up to 50 photos in one request
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # a location with its own add_header drops the server's: every such location includes this file again
    include /etc/nginx/snippets/slidechi-headers.conf;

    # ---- API: the website's own routes and the editor's; nothing else of the backend is reachable here
    location ~ ^/api/web/(login|verify)$ {
        limit_req zone=slidechi_auth burst=5 nodelay;
        include /etc/nginx/snippets/slidechi-proxy.conf;
    }
    location /api/web/ {
        limit_req zone=slidechi_api burst=40 nodelay;
        include /etc/nginx/snippets/slidechi-proxy.conf;
    }
    location /api/editor/ {
        limit_req zone=slidechi_api burst=80 nodelay;
        include /etc/nginx/snippets/slidechi-proxy.conf;
    }
    # the Mini App (routes/miniapp.py) and the admin panel (routes/admin.py)
    location ~ ^/api/(generate|restyle|decks|me|templates)$ {
        limit_req zone=slidechi_api burst=40 nodelay;
        include /etc/nginx/snippets/slidechi-proxy.conf;
    }
    location /api/admin/ {
        limit_req zone=slidechi_api burst=80 nodelay;
        include /etc/nginx/snippets/slidechi-proxy.conf;
    }
    # Payme / Click callbacks and the Telegram webhook (routes/payments.py): each checks its own signature / secret
    location /api/pay/ { include /etc/nginx/snippets/slidechi-proxy.conf; }
    location /telegram/ { include /etc/nginx/snippets/slidechi-proxy.conf; }
    location = /health { include /etc/nginx/snippets/slidechi-proxy.conf; }
    location /api/ { return 404; }

    # ---- the bot's Mini App, the editor and the admin panel (miniapp/dist, built with base /app/)
    location = /app { return 301 /app/$is_args$args; }
    location /app/assets/ {
        alias /home/slideai-src/slideai/miniapp/dist/assets/;
        expires 1y;
        include /etc/nginx/snippets/slidechi-app-headers.conf;
        add_header Cache-Control "public, immutable" always;
    }
    location /app/ {
        alias /home/slideai-src/slideai/miniapp/dist/;
        index index.html;
        include /etc/nginx/snippets/slidechi-app-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /editor.html { return 301 /app/editor.html; }   # old links (the #t= fragment is kept by the browser)
    location /templates/ {
        root /home/slideai-src/slideai/miniapp/public;
        expires 7d;
    }

    # ---- the website
    location /static/ {
        expires 1y;
        include /etc/nginx/snippets/slidechi-headers.conf;
        add_header Cache-Control "public, immutable" always;
    }
    location / {   # pages (prerendered /, /ru/, /en/, /oferta, /maxfiylik; anything else is the app): always revalidated
        include /etc/nginx/snippets/slidechi-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.html;
    }
}
