name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slideai
          POSTGRES_PASSWORD: slideai
          POSTGRES_DB: slideai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U slideai" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://slideai:slideai@127.0.0.1:5432/slideai_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Fonts and tools the engine and tests use
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea fonts-texgyre fonts-dejavu-core poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: engine
      - name: Lint
        run: ruff check app tests
      - name: Types
        run: mypy app
      - name: Tests (incl. all 40 templates and the worker loop), coverage at least 80%
        run: pytest -q --cov --cov-report=term

  miniapp:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Build (Mini App, editor, admin panel)
        run: npm run build

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Tests (Vitest)
        run: npm test
      - name: Build (slidechi.uz)
        run: npm run build
